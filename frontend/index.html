<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>UsTime</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--p:#7560aa;--pd:#624b99;--t:#eee8f6;--t2:#f5f1fa;--bg:#faf9f6;--ink:#29262f;--mut:#79747f;--line:#e6e1e9;--card:#fff;--pink:#f9d5e5;--yel:#fbe9a6;--bgout:#e9e4f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--p:#9b87d1;--pd:#b6a5e6;--t:#2f2a3d;--t2:#262234;--bg:#1d1a24;--ink:#f1eef5;--mut:#a8a2b3;--line:#383344;--card:#27232f;--pink:#4a2f3f;--yel:#4d4423;--bgout:#121016}}
:root[data-theme=dark]{--p:#9b87d1;--pd:#b6a5e6;--t:#2f2a3d;--t2:#262234;--bg:#1d1a24;--ink:#f1eef5;--mut:#a8a2b3;--line:#383344;--card:#27232f;--pink:#4a2f3f;--yel:#4d4423;--bgout:#121016}
*{box-sizing:border-box;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bgout);color:var(--ink)}
#app{max-width:430px;height:100%;margin:0 auto;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
main{flex:1;overflow-y:auto;padding:20px 24px 24px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h1{font-size:28px;font-weight:600;letter-spacing:-.5px;line-height:1.15}h2{font-size:18px;font-weight:600;margin:22px 0 12px}
.mut{color:var(--mut);font-size:13px}.eye{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--p);font-weight:600;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.btn{width:100%;height:52px;border:0;border-radius:100px;background:var(--p);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.sec{background:var(--t);color:var(--pd)}
.chip{display:inline-block;padding:8px 14px;border-radius:100px;border:1px solid var(--line);background:var(--card);font-size:13px;margin:0 6px 8px 0;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.row{display:flex;gap:12px;align-items:center}.sp{justify-content:space-between}
.scroll{display:flex;gap:12px;overflow-x:auto;margin:0 -24px;padding:0 24px 4px}.scroll>*{flex:0 0 190px}
.img{height:96px;border-radius:16px;display:grid;place-items:center;font-size:40px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.stats div{background:var(--t2);border-radius:16px;padding:10px 4px;text-align:center}.stats b{display:block;font-size:18px}.stats span{font-size:10px;color:var(--mut)}
.save{border:0;background:var(--t);color:var(--pd);border-radius:100px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}.save.on{background:var(--p);color:#fff}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:8px 8px 10px}nav button{flex:1;border:0;background:none;color:var(--mut);font-size:10px;display:grid;gap:2px;justify-items:center;cursor:pointer}nav button span{font-size:20px}nav .on{color:var(--p);font-weight:600}
#toast{position:absolute;left:24px;right:24px;bottom:84px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;font-size:13px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:9}#toast.show{opacity:1;transform:none}
.sheet{position:absolute;inset:0;background:rgba(20,16,30,.45);display:flex;align-items:flex-end;z-index:8}.sheet>div{background:var(--bg);border-radius:28px 28px 0 0;padding:24px;width:100%;animation:in .25s}
.opt{width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);background:var(--card);border-radius:16px;margin-bottom:10px;font-size:15px;color:var(--ink);cursor:pointer}.opt.ok{background:#dff3e4;border-color:#6bbf84;color:#14532d}.opt.no{background:var(--pink);color:var(--ink)}
.bar{height:8px;border-radius:8px;background:var(--t);overflow:hidden}.bar i{display:block;height:100%;background:var(--p);border-radius:8px;transition:width .5s}
.mood{font-size:30px;background:var(--t2);border:2px solid transparent;border-radius:18px;padding:10px 0;flex:1;cursor:pointer}.mood.on{border-color:var(--p);background:var(--t)}
.grid{columns:2;column-gap:12px}.grid>div{break-inside:avoid;margin-bottom:12px;border-radius:18px;display:grid;place-items:center;font-size:36px;position:relative;overflow:hidden}.grid small{position:absolute;bottom:8px;left:10px;font-size:11px;font-weight:600;color:#29262f}
.pet{font-size:96px;text-align:center;animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
.empty{text-align:center;padding:28px;color:var(--mut);font-size:13px}
</style></head><body>
<div id="app"><main id="v"></main><nav id="nav"></nav><div id="toast"></div></div>
<script>
const $=s=>document.querySelector(s);
const D=[]; // places from Supabase, filled by loadPlaces()
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
// The places table has no emoji or colours, so pick them from the category.
const CAT={Adventurous:["⛳","#fbe9a6,#d8f0dc"],Creative:["🎨","#f9d5e5,#eee8f6"],"Food & Drinks":["🍷","#e6d8f3,#f9d5e5"],Outdoors:["🌳","#d8f0dc,#f0f7d9"],Classes:["🍝","#fde0c8,#f9d5e5"],Relaxing:["🦌","#d8f0dc,#eee8f6"]};
const hrs=m=>!m?"":m==60?"1 hr":+(m/60).toFixed(1)+" hrs";
const place=r=>{const[e,g]=CAT[r.category]||["✨","#eee8f6,#f9d5e5"];return{id:r.id,n:r.name,e,c:r.category,p:r.price_note||["Free","Under $25","$25–$50","$50+"][r.price_tier],b:r.price_tier,d:hrs(r.duration_min),g,w:r.description||"",lat:r.lat,lng:r.lng,a:r.address||"",k:r.distance_km}};
const S={r:10,theme:"light",tab:"home",saved:new Set(),partner:new Set(),cat:"All",bud:"Any",mood:null,share:true,xp:62,hap:80,pts:140,pet:"🐰",msgs:[["Mon","😊","Coffee and a long walk"],["Tue","😐","Busy but fine"],["Wed","🤩","Booked our pottery date!"]]};
const Q=[["What is Jaimi's dream vacation destination?",["Tokyo","Lisbon","Banff","Santorini"],1],["Jaimi's go-to comfort food?",["Ramen","Pizza","Tacos","Mac & cheese"],0],["Where was your first date?",["Cafe","Mini golf","Park","Cinema"],0]];
let qi=0;
S.here={lat:42.9849,lng:-81.2453,label:"Downtown London, ON"};
// Radius search runs on the server (places_nearby). reqN drops answers that arrive after a newer request.
let reqN=0;
async function loadPlaces(){const n=++reqN;S.loading=true;try{const rows=await api.placesNearby({lat:S.here.lat,lng:S.here.lng,radiusKm:S.r});if(n!=reqN)return;D.splice(0,D.length,...rows.map(place))}catch(e){if(n==reqN)toast(e.message)}finally{if(n==reqN){S.loading=false;if(S.tab=="explore"&&$("#lst"))$("#lst").innerHTML=LST();else if(S.tab=="home"&&$("#nav").style.display!="none")render()}}}
function useLoc(){if(!navigator.geolocation)return toast("Location isn't available here");toast("Finding you…");navigator.geolocation.getCurrentPosition(p=>{S.here={lat:p.coords.latitude,lng:p.coords.longitude,label:"Your location"};render();loadPlaces()},()=>toast("Location permission was blocked"))}
function LST(){if(S.loading&&!D.length)return '<div class="empty">Loading places…</div>';const L=D.filter(d=>d.k<=S.r&&(S.cat=="All"||d.c==S.cat||(S.cat=="Romantic"&&d.b>=2))&&(S.bud=="Any"||d.b==BM[S.bud])).sort((a,b)=>a.k-b.k);return L.map(d=>card(d,1)).join("")||'<div class="empty">Nothing within '+S.r+' km. Try widening your radius.</div>'}
S.mem="story";const TODAY=new Date("2026-10-27"),fd=d=>d.toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"}),left=c=>Math.ceil((c.d-TODAY)/864e5);
S.caps=[{t:"First 100 days",d:new Date("2026-10-01"),n:"3 notes · 6 photos",o:0,m:[["Adarsha","Can't believe it's been 100 days already. Pottery night is still my favourite."],["Jaimi","Promise we keep trying new places. Next up: Tin Cup?"]]},{t:"Our first year",d:new Date("2027-03-14"),n:"1 note · 2 photos",o:0,m:[]}];
function MT(){return `<div style="margin:14px 0">${[["story","Story"],["capsule","Capsule"]].map(a=>`<span class="chip ${S.mem==a[0]?'on':''}" onclick="S.mem='${a[0]}';render()">${a[1]}</span>`).join("")}</div>`}
function CAP(){return `<div class="eye">Time capsule</div><h1>Open It Someday.</h1>${MT()}<p class="mut" style="margin-bottom:14px">Seal notes and predictions together. It stays locked until the date you pick.</p><button class="btn" style="margin-bottom:16px" onclick="newCap()">+ Create a capsule</button>`+(S.caps.map((c,i)=>{const L=left(c);return L>0?`<div class="card" style="margin-bottom:12px" onclick="toast('Still sealed 🔒 ${L} days to go')"><div class="row"><div class="img" style="width:56px;height:56px;flex:none;font-size:26px;background:var(--t)">🔒</div><div style="flex:1"><b>${c.t}</b><div class="mut">Opens ${fd(c.d)}</div></div></div><div class="bar" style="margin:12px 0 6px"><i style="width:${Math.min(95,Math.max(6,100-L/2))}%"></i></div><div class="row sp mut"><span>${L} days to go</span><span>${c.n}</span></div></div>`:`<div class="card" style="margin-bottom:12px;background:var(--yel);border:0"><div class="row"><div class="img" style="width:56px;height:56px;flex:none;font-size:26px;background:var(--card)">${c.o?'📖':'💌'}</div><div><b>${c.t}</b><div class="mut">${c.o?'Opened':'Ready to open'} · ${c.n}</div></div></div><button class="btn" style="margin-top:12px" onclick="openCap(${i})">${c.o?'Read again':'Open together'}</button></div>`}).join("")||'<div class="empty">No capsules yet. Seal your first one 💌</div>')}
function sheet(h){const s=document.createElement("div");s.className="sheet";s.onclick=e=>{if(e.target==s)s.remove()};s.innerHTML=`<div>${h}</div>`;$("#app").append(s);return s}
function newCap(){sheet(`<div class="eye">New capsule</div><h1 style="font-size:22px;margin-bottom:14px">Seal something for later</h1><input id="ct" placeholder="Title (e.g. Our first year)" style="width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font-size:14px;margin-bottom:10px"><textarea id="cn" placeholder="Write a note to future you two…" style="width:100%;height:90px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px;font-size:14px;margin-bottom:10px"></textarea><select id="cd" style="width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;font-size:14px;margin-bottom:14px"><option value="3">Opens in 3 months</option><option value="6" selected>Opens in 6 months</option><option value="12">Opens in 1 year</option><option value="24">Opens in 2 years</option></select><button class="btn" onclick="seal()">Seal capsule 🔒</button>`)}
function seal(){const t=$("#ct").value.trim()||"Untitled capsule",n=$("#cn").value.trim(),d=new Date(TODAY);d.setMonth(d.getMonth()+ +$("#cd").value);S.caps.unshift({t,d,n:"1 note · 0 photos",o:0,m:[["Adarsha",n||"(no note)"]]});document.querySelector(".sheet").remove();toast("Sealed 🔒 Opens "+fd(d)+". Jaimi can add to it.");render()}
function openCap(i){const c=S.caps[i];if(!c.o){c.o=1;S.pts+=30;toast("+30 pts · saved to Our Story")}sheet(`<div class="eye">Opened 💌</div><h1 style="font-size:22px;margin-bottom:14px">${c.t}</h1>${c.m.map(m=>`<div class="card" style="margin-bottom:10px"><div class="mut" style="margin-bottom:4px">From ${m[0]}</div>${m[1]}</div>`).join("")}<button class="btn" onclick="this.closest('.sheet').remove();render()">Close</button>`)}
// Shrinking filters what we already have instantly; the server query follows once the slider stops moving.
function rad(v){S.r=+v;$("#rl").textContent=v+" km";$("#lst").innerHTML=LST();clearTimeout(rad.t);rad.t=setTimeout(loadPlaces,250)}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2200)}
function save(n){const name=D.find(x=>x.id==n)?.n;if(S.saved.has(n)){S.saved.delete(n);toast("Removed from wishlist")}else{S.saved.add(n);S.partner.has(n)?toast("❤️ It's a Match! You both want to try "+name+"."):toast("Saved to shared wishlist")}render()}
function card(d,w){return `<div class="card" style="padding:10px;${w?'':'flex:0 0 190px'}"><div class="img" style="background:linear-gradient(135deg,${d.g.split(",").join(",")})" onclick="detail('${d.id}')">${d.e}</div><div style="font-weight:600;margin:10px 4px 2px">${esc(d.n)}</div><div class="mut" style="margin:0 4px 8px">${esc(d.p)} · ${d.d} · ${d.k.toFixed(1)} km</div><div class="row sp" style="margin:0 4px"><button class="save ${S.saved.has(d.id)?'on':''}" onclick="save('${d.id}')">${S.saved.has(d.id)?'♥ Saved':'♡ Save'}</button>${w?`<button class="save" onclick="toast('Added to calendar')">📅 Add</button>`:''}</div></div>`}
function detail(n){const d=D.find(x=>x.id==n);const s=document.createElement("div");s.className="sheet";s.onclick=e=>{if(e.target==s)s.remove()};s.innerHTML=`<div><div class="img" style="height:140px;font-size:60px;background:linear-gradient(135deg,${d.g})">${d.e}</div><h1 style="font-size:24px;margin-top:16px">${esc(d.n)}</h1><p class="mut" style="margin:6px 0 12px">${esc(d.p)} est. · ${d.d} · ${d.k.toFixed(1)} km away<br>📍 ${esc(d.a)}, London</p><p style="font-size:14px;line-height:1.5;margin-bottom:16px">${esc(d.w)}</p><div class="row"><a class="btn sec" style="display:grid;place-items:center;text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}">Directions</a><button class="btn" onclick="toast('Added to calendar ✓');this.closest('.sheet').remove()">Add to Calendar</button></div></div>`;$("#app").append(s)}
const V={
home:()=>`<p class="mut">Good Evening</p><h1>${S.mate?esc(S.me?.name)+" & "+esc(S.mate.name):"Hi, "+esc(S.me?.name)} ❤️</h1><div class="stats"><div><b>150</b><span>Days</span></div><div><b>24</b><span>Done</span></div><div><b>2</b><span>Upcoming</span></div><div style="background:var(--yel)"><b>Lv 7</b><span>Level</span></div></div>
<div class="card" style="margin-top:16px;background:linear-gradient(135deg,var(--t),var(--pink));border:0"><div class="eye">Tonight</div><h1 style="font-size:22px">Plan Your Next Date</h1><p class="mut" style="margin:6px 0 14px">Fresh ideas near London, ON</p><button class="btn" onclick="go('explore')">Explore Date Ideas</button></div>${S.mate?'':`<div class="card" style="margin-top:12px"><b>Invite your partner</b><p class="mut" style="margin:4px 0 12px">Pair up to share a wishlist and see your matches.</p><button class="btn sec" onclick="pairing()">Pair with your partner</button></div>`}
<h2>Recommended for You Two</h2><div class="scroll">${D.slice(0,5).map(d=>card(d)).join("")}</div>
<h2>Today's Couple Challenge</h2><div class="card" style="background:var(--yel);border:0"><p style="font-size:15px;line-height:1.4;margin-bottom:12px">Ask your partner three questions you've never asked before.</p><button class="btn" onclick="S.pts+=20;toast('+20 points · challenge started');render()">Start Challenge</button></div>`,
explore:()=>{const cats=["All","Romantic","Creative","Outdoors","Classes","Food & Drinks","Adventurous","Relaxing"],buds=["Any","Free","Under $25","$25–$50","$50+"];const bm={Free:0,"Under $25":1,"$25–$50":2,"$50+":3};window.BM=bm;
return `<div class="eye">Date discovery</div><h1>Find Your Perfect Date.</h1><div class="card" style="margin:16px 0 4px"><div class="row sp"><b>Distance</b><span id="rl" style="color:var(--p);font-weight:600">${S.r} km</span></div><input type="range" min="1" max="25" value="${S.r}" style="width:100%;accent-color:var(--p);margin:10px 0 4px" oninput="rad(this.value)"><div class="row sp mut"><span>📍 ${esc(S.here.label)}</span><span style="cursor:pointer;color:var(--p)" onclick="useLoc()">Use my location</span></div></div><div style="margin:16px 0 4px">${buds.map(b=>`<span class="chip ${S.bud==b?'on':''}" onclick="S.bud='${b}';render()">${b}</span>`).join("")}</div><div>${cats.map(b=>`<span class="chip ${S.cat==b?'on':''}" onclick="S.cat='${b}';render()">${b}</span>`).join("")}</div><div id="lst" style="margin-top:8px;display:grid;gap:12px">${LST()}</div>`},
games:()=>{const G=[["💞","How Well Do You Know Me?","5 min",50],["🤔","Would You Rather?","10 min",30],["🔤","Heads Up!","8 min",40],["🧩","Make a Word","6 min",30],["💧","Fill the Water Cup","3 min",20],["🏆","Couple Trivia","10 min",60]];
return `<div class="eye">Games · ${S.pts} pts</div><h1>Play Together.</h1><div style="display:grid;gap:12px;margin-top:16px">${G.map((g,i)=>`<div class="card row"><div class="img" style="width:60px;height:60px;flex:none;font-size:28px;background:var(--t)">${g[0]}</div><div style="flex:1"><b style="font-size:15px">${g[1]}</b><div class="mut">${g[2]} · ${g[3]} pts</div></div><button class="save on" onclick="${i?`toast('${g[1]} is coming soon')`:'quiz()'}">Play</button></div>`).join("")}</div>`},
memories:()=>S.mem=="capsule"?CAP():`<div class="eye">Memories</div><h1>Our Story.</h1>${MT()}<div class="card" style="margin:16px 0;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;border:0"><b>Our Relationship Wrapped</b><div class="row" style="margin:12px 0 4px;flex-wrap:wrap">${[["24","dates"],["12","new places"],["37","games"],["150","days"]].map(a=>`<div style="flex:1;min-width:60px"><b style="font-size:24px">${a[0]}</b><div style="font-size:11px;opacity:.8">${a[1]}</div></div>`).join("")}</div><div style="font-size:12px;margin-top:8px;background:rgba(255,255,255,.18);border-radius:12px;padding:8px">Favourite activity: Mini Golf ⛳</div></div>
<div class="grid">${[["🏺","Pottery · Sep 14","#f9d5e5",140],["⛳","Mini Golf · Aug 30","#fbe9a6",190],["🌅","Sunset walk","#fde0c8",110],["🍝","Pasta night","#eee8f6",170],["🎉","100 days!","#d8f0dc",120]].map(m=>`<div style="background:${m[2]};height:${m[3]}px" onclick="toast('${m[1]}')">${m[0]}<small>${m[1]}</small></div>`).join("")}</div><button class="btn sec" onclick="toast('Photo upload is simulated in this prototype')">+ Add memory</button>`,
profile:()=>{const sub=S.sub||"checkin";return `<div class="eye">Us</div><h1>${sub=="pet"?"Our Pet":sub=="settings"?"Settings":"How Are We Doing Today?"}</h1><div style="margin:14px 0">${[["checkin","Check-in"],["pet","Pet"],["settings","Settings"]].map(a=>`<span class="chip ${sub==a[0]?'on':''}" onclick="S.sub='${a[0]}';render()">${a[1]}</span>`).join("")}</div>`+(sub=="settings"?SET():sub=="pet"?`<div class="card"><div class="pet">${S.pet}</div><div class="row sp"><b>Mochi · Level 4</b><span class="mut">Happiness ${S.hap}%</span></div><div class="bar" style="margin:10px 0"><i style="width:${S.xp}%"></i></div><p class="mut">${S.xp}/100 XP</p><div class="row" style="margin-top:14px"><button class="btn" onclick="S.xp=Math.min(100,S.xp+10);S.hap=Math.min(100,S.hap+5);toast('Yum! +10 XP');render()">Feed 🍓</button><button class="btn sec" onclick="S.pet=['🐰','🐱','🦊','🐼'][(['🐰','🐱','🦊','🐼'].indexOf(S.pet)+1)%4];render()">Change pet</button></div></div><div class="card" style="margin-top:12px;background:var(--yel);border:0">🎀 Next reward: Bow tie at Level 5</div>`:`<div class="row">${["🤩","😊","😐","😰","😢"].map(m=>`<button class="mood ${S.mood==m?'on':''}" onclick="S.mood='${m}';render()">${m}</button>`).join("")}</div><p class="mut" style="margin:14px 0 6px">What's one thing that made you smile today?</p><textarea id="msg" style="width:100%;height:70px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px;font-size:14px"></textarea><label class="row mut" style="margin:10px 0"><input type="checkbox" ${S.share?'checked':''} onchange="S.share=this.checked"> Share with ${S.mate?esc(S.mate.name):"your partner"}</label><button class="btn" onclick="ci()">Save check-in</button><h2>Recent</h2>${S.msgs.map(m=>`<div class="card row" style="margin-bottom:8px"><span style="font-size:24px">${m[1]}</span><div><b>${m[0]}</b><div class="mut">${m[2]}</div></div></div>`).join("")}`)}};
function setTheme(t,q){S.theme=t;const r=document.documentElement;t=="auto"?r.removeAttribute("data-theme"):r.dataset.theme=t;if(!q){toast((t=="auto"?"Matching your phone":t=="dark"?"Dark theme on":"Light theme on"));render()}}
function SET(){const o=[["light","Light","Our signature look","#faf9f6","#7560aa"],["dark","Dark","Easy on the eyes at night","#1d1a24","#9b87d1"],["auto","Auto","Follow your phone","linear-gradient(90deg,#faf9f6 50%,#1d1a24 50%)","#7560aa"]];return `<h2 style="margin-top:0">Appearance</h2>${o.map(a=>`<div class="card row" style="margin-bottom:10px;${S.theme==a[0]?'border:2px solid var(--p)':''}" onclick="setTheme('${a[0]}')"><div style="width:52px;height:52px;border-radius:14px;background:${a[3]};border:1px solid var(--line);display:grid;place-items:end start;padding:8px"><i style="width:16px;height:16px;border-radius:50%;background:${a[4]}"></i></div><div style="flex:1"><b>${a[1]}</b><div class="mut">${a[2]}</div></div><span style="color:var(--p);font-size:18px">${S.theme==a[0]?'✓':''}</span></div>`).join("")}<h2>Notifications</h2><div class="card row sp"><span>Daily check-in reminder</span><input type="checkbox" checked></div><h2>Partner</h2><div class="card row sp"><span>${S.mate?"Paired with "+esc(S.mate.name)+" ❤️":"Not paired yet"}</span>${S.mate?"":`<button class="save on" onclick="pairing()">Pair</button>`}</div><h2>Account</h2><div class="card row sp"><span class="mut">${esc(S.user?.email)}</span><button class="save" onclick="logout()">Sign out</button></div>`}
function ci(){if(!S.mood)return toast("Pick a mood first");S.msgs.unshift(["Today",S.mood,$("#msg").value||"No note"]);S.mood=null;toast(S.share?"Shared with "+(S.mate?.name||"your partner")+" ❤️":"Saved privately");render()}
function quiz(){const q=Q[qi%Q.length];const s=document.createElement("div");s.className="sheet";s.innerHTML=`<div><div class="eye">How well do you know me? · ${qi%Q.length+1}/${Q.length}</div><h1 style="font-size:22px;margin-bottom:16px">${q[0]}</h1>${q[1].map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}<div id="res" class="mut"></div></div>`;s.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ok=i==q[2];s.querySelectorAll(".opt").forEach(x=>{x.disabled=1;if(+x.dataset.i==q[2])x.classList.add("ok")});if(!ok)b.classList.add("no");if(ok)S.pts+=50;s.querySelector("#res").innerHTML=(ok?"✅ Correct! +50 points":"Not quite — nice try!")+`<br><br><button class="btn" id="nx">${qi%Q.length<Q.length-1?"Next question":"Finish"}</button>`;s.querySelector("#nx").onclick=()=>{s.remove();qi++;if(qi%Q.length)quiz();else{toast("Round done! 🎉");render()}}});s.onclick=e=>{if(e.target==s)s.remove()};$("#app").append(s)}
const T=[["home","🏠","Home"],["explore","🧭","Explore"],["games","🎮","Games"],["memories","📸","Memories"],["profile","❤️","Profile"]];
function go(t){S.tab=t;render()}
function render(){const m=$("#v");m.style.animation="none";m.offsetHeight;m.style.animation="";m.innerHTML=V[S.tab]();$("#nav").innerHTML=T.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("")}
function welcome(){$("#nav").style.display="none";$("#v").innerHTML=`<div style="text-align:center;padding-top:30px"><div class="row" style="justify-content:center"><b style="font-size:26px;color:var(--p)"><span style="color:#e0245e">♥</span> UsTime</b></div><div class="img" style="height:280px;margin:28px 0;font-size:90px;background:linear-gradient(135deg,var(--t),var(--pink))">🏺</div><h1 style="text-align:left;font-size:34px">Make Every Moment Together Count.</h1><p class="mut" style="text-align:left;margin:12px 0 28px;font-size:15px">Discover dates, create memories, and make your relationship an adventure.</p><button class="btn" onclick="authForm('up')">Get Started →</button><p class="mut" style="margin-top:14px">Already making memories? <a style="color:var(--p);cursor:pointer" onclick="authForm('in')">Sign In</a></p></div>`}
// ---------- Auth (Supabase) ----------
const FS="width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font-size:14px;margin-bottom:10px";
const inp=(id,type,ph,ac,x="")=>`<input id="${id}" type="${type}" placeholder="${ph}" autocomplete="${ac}" required ${x} style="${FS}">`;
function authForm(mode){const up=mode=="up";$("#nav").style.display="none";$("#v").innerHTML=`<div style="padding-top:30px"><b style="font-size:22px;color:var(--p)"><span style="color:#e0245e">♥</span> UsTime</b><h1 style="margin:28px 0 8px">${up?"Create Your Account.":"Welcome Back."}</h1><p class="mut" style="margin-bottom:20px">${up?"You'll pair up with your partner next.":"Sign in to pick up where you left off."}</p><form onsubmit="event.preventDefault();auth('${mode}')">${up?inp("an","text","Your first name","given-name"):""}${inp("ae","email","Email","email")}${inp("ap","password",up?"Password (at least 6 characters)":"Password",up?"new-password":"current-password",up?'minlength="6"':"")}<button class="btn" id="ab" style="margin-top:6px">${up?"Sign up":"Sign in"}</button></form><p class="mut" style="margin-top:16px;text-align:center">${up?"Already have an account?":"New here?"} <a style="color:var(--p);cursor:pointer" onclick="authForm('${up?"in":"up"}')">${up?"Sign in":"Create an account"}</a></p><p style="text-align:center;margin-top:10px"><a class="mut" style="cursor:pointer" onclick="welcome()">← Back</a></p></div>`}
async function auth(mode){const e=$("#ae").value.trim(),p=$("#ap").value,b=$("#ab");b.disabled=true;try{if(mode=="up"){const r=await api.signUp(e,p,$("#an").value.trim());
  // With "Confirm email" on (the Supabase default) there's no session until the link is clicked.
  if(!r.session){$("#v").innerHTML=`<div style="padding-top:60px;text-align:center"><div style="font-size:60px">📬</div><h1 style="margin:16px 0 8px">Check Your Email.</h1><p class="mut" style="margin-bottom:24px">We sent a confirmation link to ${esc(e)}. Click it and you'll come back here signed in.</p><button class="btn sec" onclick="authForm('in')">I've confirmed, sign me in</button></div>`;return}}
  else await api.signIn(e,p);await boot()}catch(x){toast(x.message);b.disabled=false}}
async function loadMe(){const u=await api.getUser();if(!u)return false;S.user=u;S.me=await api.ensureProfile(u);S.couple=await api.getCouple(u.id);S.mate=S.couple?.partner||null;return true}
async function boot(){try{if(!await loadMe())return welcome();S.couple?enterApp():pairing()}catch(e){toast(e.message);welcome()}}
async function enterApp(fresh){if(fresh)try{await loadMe()}catch(e){toast(e.message)}$("#nav").style.display="";go("home");loadPlaces()}
async function logout(){try{await api.signOut()}catch(e){toast(e.message)}Object.assign(S,{user:null,me:null,couple:null,mate:null,tab:"home"});D.length=0;welcome()}
// ---------- Pairing (invite codes) ----------
function pairing(){$("#nav").style.display="none";$("#v").innerHTML=`<div class="eye">Pair up</div><h1>Connect With Your Partner.</h1><p class="mut" style="margin:10px 0 20px">One of you creates a code, the other types it in. Codes last 48 hours.</p><div class="card" style="margin-bottom:12px"><b>Invite your partner</b><p class="mut" style="margin:4px 0 12px">Make a code and send it to them.</p><div id="code" style="display:none;font-size:34px;font-weight:700;letter-spacing:6px;text-align:center;color:var(--p);margin-bottom:12px"></div><button class="btn" id="mk" onclick="makeCode()">Create invite code</button></div><div class="card" style="margin-bottom:16px"><b>Got a code from your partner?</b><p class="mut" style="margin:4px 0 12px">Type it here to join them.</p><input id="jc" maxlength="6" placeholder="e.g. 3FA9C1" autocomplete="off" style="${FS};text-transform:uppercase;letter-spacing:3px"><button class="btn" onclick="joinCode()">Join</button></div><button class="btn sec" onclick="enterApp(true)">Continue to the app</button>`}
async function makeCode(){const b=$("#mk");b.disabled=true;try{const c=await api.createInvite(),el=$("#code");el.textContent=c;el.style.display="";b.textContent="Make a new code";try{await navigator.clipboard.writeText(c);toast("Code copied. Send it to your partner")}catch{toast("Send this code to your partner")}}catch(e){toast(e.message)}b.disabled=false}
async function joinCode(){const v=$("#jc").value.trim();if(v.length!=6)return toast("Codes are 6 characters");try{await api.joinCouple(v);await enterApp(true);toast(S.mate?"Paired with "+S.mate.name+" ❤️":"Paired ❤️")}catch(e){toast(e.message)}}
setTheme(S.theme,1);$("#nav").style.display="none";$("#v").innerHTML='<div class="empty">Loading…<br><br>Stuck here? Open the app through the local server (http://localhost:3000), not by double-clicking the file.</div>';
</script>
<script type="module">
// api.js talks to Supabase. It's put on window so the onclick handlers above can use it.
import * as api from "./src/api.js";
window.api=api;boot();
</script></body></html>
