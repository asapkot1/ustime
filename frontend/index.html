<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>UsTime</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--p:#7560aa;--pd:#624b99;--t:#eee8f6;--t2:#f5f1fa;--bg:#faf9f6;--ink:#29262f;--mut:#79747f;--line:#e6e1e9;--card:#fff;--pink:#f9d5e5;--yel:#fbe9a6;--bgout:#e9e4f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--p:#9b87d1;--pd:#b6a5e6;--t:#2f2a3d;--t2:#262234;--bg:#1d1a24;--ink:#f1eef5;--mut:#a8a2b3;--line:#383344;--card:#27232f;--pink:#4a2f3f;--yel:#4d4423;--bgout:#121016}}
:root[data-theme=dark]{--p:#9b87d1;--pd:#b6a5e6;--t:#2f2a3d;--t2:#262234;--bg:#1d1a24;--ink:#f1eef5;--mut:#a8a2b3;--line:#383344;--card:#27232f;--pink:#4a2f3f;--yel:#4d4423;--bgout:#121016}
*{box-sizing:border-box;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bgout);color:var(--ink)}
#app{max-width:430px;height:100%;margin:0 auto;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
main{flex:1;overflow-y:auto;padding:20px 24px 24px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h1{font-size:28px;font-weight:600;letter-spacing:-.5px;line-height:1.15}h2{font-size:18px;font-weight:600;margin:22px 0 12px}
.mut{color:var(--mut);font-size:13px}.eye{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--p);font-weight:600;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.btn{width:100%;height:52px;border:0;border-radius:100px;background:var(--p);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.sec{background:var(--t);color:var(--pd)}
.chip{display:inline-block;padding:8px 14px;border-radius:100px;border:1px solid var(--line);background:var(--card);font-size:13px;margin:0 6px 8px 0;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.row{display:flex;gap:12px;align-items:center}.sp{justify-content:space-between}
.scroll{display:flex;gap:12px;overflow-x:auto;margin:0 -24px;padding:0 24px 4px}.scroll>*{flex:0 0 190px}
.img{height:96px;border-radius:16px;display:grid;place-items:center;font-size:40px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.stats div{background:var(--t2);border-radius:16px;padding:10px 4px;text-align:center}.stats b{display:block;font-size:18px}.stats span{font-size:10px;color:var(--mut)}
.save{border:0;background:var(--t);color:var(--pd);border-radius:100px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}.save.on{background:var(--p);color:#fff}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:8px 8px 10px}nav button{flex:1;border:0;background:none;color:var(--mut);font-size:10px;display:grid;gap:2px;justify-items:center;cursor:pointer}nav button span{font-size:20px}nav .on{color:var(--p);font-weight:600}
#toast{position:absolute;left:24px;right:24px;bottom:84px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;font-size:13px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:9}#toast.show{opacity:1;transform:none}
.sheet{position:absolute;inset:0;background:rgba(20,16,30,.45);display:flex;align-items:flex-end;z-index:8}.sheet>div{background:var(--bg);border-radius:28px 28px 0 0;padding:24px;width:100%;animation:in .25s}
.opt{width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);background:var(--card);border-radius:16px;margin-bottom:10px;font-size:15px;color:var(--ink);cursor:pointer}.opt.ok{background:#dff3e4;border-color:#6bbf84;color:#14532d}.opt.no{background:var(--pink);color:var(--ink)}
.bar{height:8px;border-radius:8px;background:var(--t);overflow:hidden}.bar i{display:block;height:100%;background:var(--p);border-radius:8px;transition:width .5s}
.mood{font-size:30px;background:var(--t2);border:2px solid transparent;border-radius:18px;padding:10px 0;flex:1;cursor:pointer}.mood.on{border-color:var(--p);background:var(--t)}
.grid{columns:2;column-gap:12px}.grid>div{break-inside:avoid;margin-bottom:12px;border-radius:18px;display:grid;place-items:center;font-size:36px;position:relative;overflow:hidden}.grid small{position:absolute;bottom:8px;left:10px;font-size:11px;font-weight:600;color:#29262f}
.pet{font-size:96px;text-align:center;animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
.empty{text-align:center;padding:28px;color:var(--mut);font-size:13px}
</style></head><body>
<div id="app"><main id="v"></main><nav id="nav"></nav><div id="toast"></div></div>
<script>
const $=s=>document.querySelector(s);
const D=[]; // places from Supabase, filled by loadPlaces()
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
// The places table has no emoji or colours, so pick them from the category.
const CAT={Adventurous:["⛳","#fbe9a6,#d8f0dc"],Creative:["🎨","#f9d5e5,#eee8f6"],"Food & Drinks":["🍷","#e6d8f3,#f9d5e5"],Outdoors:["🌳","#d8f0dc,#f0f7d9"],Classes:["🍝","#fde0c8,#f9d5e5"],Relaxing:["🦌","#d8f0dc,#eee8f6"]};
const hrs=m=>!m?"":m==60?"1 hr":+(m/60).toFixed(1)+" hrs";
// One date idea = an activity (t, e.g. "Go ice skating") at a place (n). id is the activity, pid the place.
const act=r=>{const[e,g]=CAT[r.category]||["✨","#eee8f6,#f9d5e5"];return{id:r.id,pid:r.place_id,t:r.title,n:r.place_name,e,c:r.category,p:r.price_note||["Free","Under $25","$25–$50","$50+"][r.price_tier],b:r.price_tier,d:hrs(r.duration_min),g,w:r.description||"",tip:r.tip||"",mo:r.months,lat:r.lat,lng:r.lng,a:r.address||"",k:r.distance_km,ph:r.photo_url,cr:r.photo_credit}};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// Months are stored in season order (e.g. [12,1,2]), so first and last give the range.
const season=m=>!m?"All year":m.length>=11?"Most of the year":MON[m[0]-1]+(m.length>1?"–"+MON[m[m.length-1]-1]:" only");
const what=d=>d.t+" at "+d.n;
// Best idea per place, so one place doesn't fill a whole list.
const perPlace=L=>{const seen=new Set();return rank(L).filter(d=>!seen.has(d.pid)&&seen.add(d.pid))};
// A place's photo if it has one, otherwise the category colours.
const pbg=d=>d.ph?`url('${esc(d.ph)}') center/cover,var(--t)`:`linear-gradient(135deg,${d.g})`;
const cal=d=>"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Date: "+what(d))+"&location="+encodeURIComponent(d.n+", "+d.a)+"&details="+encodeURIComponent((d.tip+" "+d.w).trim());
const S={r:10,theme:"light",tab:"home",saved:new Set(),partner:new Set(),cat:"All",bud:"Any",mood:null,share:true,checks:[],pet:null};
// check_ins.mood values in the database, and the emoji the app shows for each.
const MOODS=[["amazing","🤩"],["happy","😊"],["neutral","😐"],["stressed","😰"],["sad","😢"]],MOOD=Object.fromEntries(MOODS);
const KINDS=[["bunny","🐰"],["cat","🐱"],["fox","🦊"],["panda","🐼"],["dog","🐶"]],PE=k=>(KINDS.find(x=>x[0]==k)||KINDS[0])[1];
// Highlight one choice in a row without re-rendering (so text typed nearby isn't lost).
function pickOne(el,key,val){S[key]=val;el.parentElement.querySelectorAll(".mood").forEach(b=>b.classList.toggle("on",b==el))}
// Starting points for the radius search. "Use my location" replaces these with the phone's position.
const CITIES=[["Brampton",43.6857,-79.7599],["Mississauga",43.5890,-79.6441],["Toronto",43.6532,-79.3832],["Oakville",43.4675,-79.6877],["Burlington",43.3255,-79.7990],["Hamilton",43.2557,-79.8711],["Vaughan",43.8361,-79.4983],["Markham",43.8561,-79.3370],["Pickering",43.8384,-79.0868],["Oshawa",43.8971,-78.8658],["Guelph",43.5448,-80.2482],["Waterloo",43.4643,-80.5204],["Kitchener",43.4516,-80.4925],["London",42.9849,-81.2453]];
S.here={lat:CITIES[0][1],lng:CITIES[0][2],label:CITIES[0][0]};S.r=15;
function pickCity(i){const c=CITIES[i];S.here={lat:c[1],lng:c[2],label:c[0]};D.length=0;loadPlaces()}
// Radius search runs on the server (places_nearby). reqN drops answers that arrive after a newer request.
let reqN=0;
async function loadPlaces(){const n=++reqN;S.loading=true;try{const rows=await api.activitiesNearby({lat:S.here.lat,lng:S.here.lng,radiusKm:S.r,month:new Date().getMonth()+1});if(n!=reqN)return;D.splice(0,D.length,...rows.map(act))}catch(e){if(n==reqN)toast(e.message)}finally{if(n==reqN){S.loading=false;if(S.tab=="explore"&&$("#lst"))$("#lst").innerHTML=LST();else if(S.tab=="home"&&$("#nav").style.display!="none")render()}}}
function useLoc(){if(!navigator.geolocation)return toast("Location isn't available here");toast("Finding you…");navigator.geolocation.getCurrentPosition(p=>{S.here={lat:p.coords.latitude,lng:p.coords.longitude,label:"Your location"};D.length=0;render();loadPlaces()},()=>toast("Location permission was blocked"))}
function LST(){if(S.loading&&!D.length)return '<div class="empty">Loading date ideas…</div>';const L=D.filter(d=>d.k<=S.r&&(S.cat=="All"||d.c==S.cat||(S.cat=="Romantic"&&d.b>=2))&&(S.bud=="Any"||d.b==BM[S.bud])).sort((a,b)=>a.k-b.k);return L.map(d=>card(d,1)).join("")||'<div class="empty">No date ideas within '+S.r+' km this month. Try widening your radius.</div>'}
S.mem="story";S.mems=[];S.caps=[];
const fd=d=>d.toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"}),left=c=>Math.ceil((new Date(c.unlock_at)-Date.now())/864e5);
// Database dates are plain "YYYY-MM-DD"; read and write them in local time so they don't shift a day.
const day=s=>{const[y,m,d]=s.split("-");return new Date(y,m-1,d)},iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function days(){if(!S.couple?.startedOn)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((t-day(S.couple.startedOn))/864e5)}
async function saveStart(){const v=$("#sd").value;if(!v)return toast("Pick a date first");if(v>iso(new Date()))return toast("That date is in the future");try{await api.setStartedOn(S.couple.coupleId,v);S.couple.startedOn=v;toast("Saved ❤️ "+days()+" days together");render()}catch(e){toast(e.message)}}
// Everything that belongs to the couple: memories, capsules, wishlist, check-ins, pet.
async function loadCoupleData(){if(!S.couple){Object.assign(S,{mems:[],caps:[],checks:[],pet:null,saved:new Set(),partner:new Set()});return}
  try{const[m,c,w,k,p]=await Promise.all([api.listMemories(),api.listCapsules(),api.listWishlist(),api.listCheckIns(),api.getPet()]);
  Object.assign(S,{mems:m,caps:c,checks:k,pet:p,saved:new Set(w.filter(r=>r.user_id==S.user.id).map(r=>r.place_id)),partner:new Set(w.filter(r=>r.user_id!=S.user.id).map(r=>r.place_id))})}catch(e){toast(e.message)}
  await Promise.all([loadChallenge(),loadDraws()])}
// ---------- Couple challenge ----------
// One challenge a day, the same for both partners (picked from the date + couple id). Each entry is [key, type, emoji, text]:
// "ask" = answer a question (your partner's answer unlocks once you've answered), "do" = do it, then tick it off.
// Keys are stored with each answer, so never reuse or renumber them; add new ones at the end.
const CH=[["a1","ask","😊","What's one thing your partner did recently that made you smile?"],["a2","ask","🛋️","Describe your perfect lazy Sunday together."],
["a3","ask","🥰","What's a small habit of your partner's that you secretly love?"],["a4","ask","📅","If you could relive one day together, which would it be?"],
["a5","ask","✨","What's something new you'd like to try together this month?"],["a6","ask","❤️","Finish the sentence: I feel most loved when you…"],
["a7","ask","🎵","What song reminds you of your partner, and why?"],["a8","ask","🌱","What's your favourite memory from your first month together?"],
["a9","ask","🙏","Name three things you're grateful for in this relationship."],["a10","ask","🎯","What's one goal you want to reach together this year?"],
["a11","ask","💪","What do you admire about how your partner handles hard days?"],["a12","ask","🌍","If you could teleport anywhere together tonight, where would you go?"],
["a13","ask","🍝","What's a meal you'd love to cook together?"],["a14","ask","📚","What's something your partner has taught you?"],
["a15","ask","🌙","Describe your dream date in one sentence."],["a16","ask","💬","What's a compliment you've never said out loud?"],
["a17","ask","😂","What's the funniest moment you've had together?"],["a18","ask","🤝","What's one way your partner could make your week easier?"],
["a19","ask","🎁","What's a tradition you'd like to start together?"],["a20","ask","🔮","Where do you see the two of you a year from now?"],
["d1","do","🎙️","Send your partner a voice note about why you appreciate them."],["d2","do","❓","Ask your partner three questions you've never asked before."],
["d3","do","🚶","Take a 15-minute walk together with no phones."],["d4","do","🍫","Surprise your partner with their favourite snack."],
["d5","do","💆","Give your partner a 5-minute shoulder massage."],["d6","do","🎧","Make your partner a 5-song playlist that reminds you of them."],
["d7","do","📝","Hide a sweet note somewhere your partner will find it."],["d8","do","📸","Take a silly selfie together and add it to Memories."],
["d9","do","📵","Have a 10-minute no-screens chat before bed."],["d10","do","☕","Try a cafe or snack spot neither of you has been to."],
["d11","do","🧭","Plan your next date together using the Explore tab."],["d12","do","🗣️","Compliment your partner in front of someone else."],
["d13","do","🌅","Watch a sunset or sunrise together."],["d14","do","🧺","Do one chore your partner usually does."],
["d15","do","🎓","Teach each other something you're good at for 10 minutes."],["d16","do","🤲","Hold hands for an entire walk."],
["d17","do","💡","Write down three date ideas each, then swap lists."],["d18","do","💃","Dance to one song together in the kitchen."],
["d19","do","📞","Call each other for 10 minutes instead of texting."],["d20","do","🍳","Make breakfast for your partner."]];
const chById=k=>CH.find(c=>c[0]==k);
const hashStr=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)};
const todayCh=()=>CH[hashStr((S.couple?.coupleId||S.user?.id||"")+iso(new Date()))%CH.length];
async function loadChallenge(){if(!S.couple)return;try{const[rows,pd]=await Promise.all([api.listChallenges(),api.partnerDone(iso(new Date()))]);Object.assign(S,{chRows:rows,chPartner:pd,chOk:1,chErr:""})}catch(e){S.chOk=0;S.chErr=e.message||String(e);console.error("challenge load failed",e)}}
async function chRetry(){await loadChallenge();render();if(!S.chOk)toast("Still not loading: "+S.chErr)}
// Streak = days in a row (ending today, or yesterday if today isn't finished yet) where you both did it.
function chStats(){const by={};(S.chRows||[]).forEach(r=>(by[r.day]=by[r.day]||new Set()).add(r.user_id));const both=d=>by[d]?.size>=2;let streak=0;const d=new Date();if(!both(iso(d)))d.setDate(d.getDate()-1);while(both(iso(d))){streak++;d.setDate(d.getDate()-1)}return{streak,total:Object.keys(by).filter(both).length}}
function CHC(){const c=todayCh(),td=iso(new Date()),pn=esc(S.mate?.name||"your partner"),ask=c[1]=="ask";
  const box=h=>`<div class="card" style="background:var(--yel);border:0"><div class="eye">${ask?"Question of the day":"Do this today"}</div><p style="font-size:16px;line-height:1.4;font-weight:600;margin:4px 0 12px">${c[2]} ${esc(c[3])}</p>${h}</div>`;
  if(!S.couple)return box(`<p class="mut" style="margin-bottom:10px">Pair with your partner to do challenges together.</p><button class="btn" onclick="pairing()">Pair up</button>`);
  if(!S.chOk)return box(`<p class="mut" style="margin-bottom:10px">Couldn't load today's challenge.${S.chErr?`<br><span style="font-size:12px">(${esc(S.chErr)})</span>`:""}</p><button class="btn sec" onclick="chRetry()">Try again</button>`);
  const rows=S.chRows.filter(r=>r.day==td),mine=rows.find(r=>r.user_id==S.user.id),theirs=rows.find(r=>r.user_id!=S.user.id),st=chStats();
  const said=r=>ask?esc(r.answer||""):"Done ✓"+(r.answer?" · "+esc(r.answer):"");
  const body=!mine?(S.chPartner?`<p style="font-size:13px;margin-bottom:10px">💌 ${pn} ${ask?"already answered. Share yours to see it!":"already did it!"}</p>`:"")
      +(ask?`<textarea id="cha" maxlength="500" placeholder="Your answer…" oninput="S.chDraft=this.value" style="${TA}">${esc(S.chDraft||"")}</textarea><button class="btn" id="chb" onclick="chDo()">Share my answer</button>`
           :`<input id="cha" maxlength="200" placeholder="How did it go? (optional)" oninput="S.chDraft=this.value" value="${esc(S.chDraft||"")}" style="${FS}"><button class="btn" id="chb" onclick="chDo()">I did it ✓</button>`)
    :`<div class="card" style="margin-bottom:8px;padding:12px"><div class="mut" style="font-size:12px">You</div>${said(mine)}</div>`
      +(theirs?`<div class="card" style="padding:12px"><div class="mut" style="font-size:12px">${pn}</div>${said(theirs)}</div>`:`<p class="mut">Waiting for ${pn}. Their ${ask?"answer":"tick"} shows up here.</p>`);
  return box(body+`<div class="row sp mut" style="margin-top:12px;font-size:12px"><span>🔥 ${st.streak}-day streak · ${st.total} done together</span><a style="cursor:pointer;color:var(--pd);font-weight:600" onclick="chHistory()">Past challenges</a></div>`)}
async function chDo(){const c=todayCh(),v=($("#cha")?.value||"").trim(),b=$("#chb");if(c[1]=="ask"&&!v)return toast("Write your answer first");busy(b,"Saving…");
  try{await api.doChallenge(S.couple.coupleId,S.user.id,iso(new Date()),c[0],v);S.chDraft="";await loadChallenge();
    if(S.pet)try{S.pet=await api.setPet(S.couple.coupleId,{xp:S.pet.xp+10})}catch{} // completing a challenge feeds the pet
    const both=S.chRows.filter(r=>r.day==iso(new Date())).length>=2;toast(both?"You both did today's challenge! 🎉 +10 XP":"Done! +10 XP"+(S.mate?". Now it's "+S.mate.name+"'s turn":""));render()}catch(e){toast(e.message);busy(b)}}
function chHistory(){const by={};(S.chRows||[]).forEach(r=>(by[r.day]=by[r.day]||[]).push(r));const days=Object.keys(by).sort().reverse();
  sheet(`<div class="eye">Past challenges</div><h1 style="font-size:22px;margin-bottom:14px">Your answers</h1><div style="max-height:60vh;overflow-y:auto">${days.map(d=>{const c=chById(by[d][0].challenge);return `<div class="card" style="margin-bottom:10px"><div class="mut" style="font-size:12px">${fd(day(d))}</div><b style="display:block;margin:4px 0 6px">${c?c[2]+" "+esc(c[3]):"A past challenge"}</b>${by[d].map(r=>`<div style="font-size:14px;margin-top:4px"><span class="mut">${r.user_id==S.user.id?"You":esc(S.mate?.name||"Partner")}:</span> ${esc(r.answer||"Done ✓")}</div>`).join("")}</div>`}).join("")||'<div class="empty">Nothing yet. Start with today\'s challenge!</div>'}</div><button class="btn" style="margin-top:10px" onclick="this.closest('.sheet').remove()">Close</button>`)}
const TA="width:100%;height:90px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px;font-size:14px;margin-bottom:10px";
const who=id=>id==S.user?.id?"you":esc(S.mate?.name||"your partner");
// Photo picker + upload helpers shared by memories, capsules and profile pictures. api.js shrinks photos before upload.
const PH=id=>`<label class="mut" for="${id}" style="display:block;margin:4px 0 6px">Photo (optional)</label><input id="${id}" type="file" accept="image/*" style="margin-bottom:16px;color:var(--ink);max-width:100%">`;
const big=f=>f&&f.size>25e6&&(toast("That photo is too big (over 25 MB)"),true);
// Round profile picture, or the person's initial until they add one.
const av=(p,sz=44)=>p?.avatar_src?`<img src="${esc(p.avatar_src)}" alt="${esc(p.name)}" style="width:${sz}px;height:${sz}px;border-radius:50%;object-fit:cover;border:2px solid var(--card);flex:none">`:`<span aria-label="${esc(p?.name)}" style="width:${sz}px;height:${sz}px;border-radius:50%;background:var(--t);color:var(--pd);display:inline-grid;place-items:center;font-weight:600;font-size:${Math.round(sz*.4)}px;border:2px solid var(--card);flex:none">${esc((p?.name||"?")[0].toUpperCase())}</span>`;
async function setAv(el){const f=el.files[0];if(!f||big(f))return;toast("Uploading your photo…");try{S.me=await api.setAvatar(S.me,f);toast("Photo updated ✓");render()}catch(e){toast(e.message)}}
function busy(b,label){if(label){b.dataset.t=b.textContent;b.textContent=label;b.disabled=true}else{b.textContent=b.dataset.t||b.textContent;b.disabled=false}}
function MT(){return `<div style="margin:14px 0">${[["story","Story"],["capsule","Capsule"]].map(a=>`<span class="chip ${S.mem==a[0]?'on':''}" onclick="S.mem='${a[0]}';render()">${a[1]}</span>`).join("")}</div>`}
function CAP(){return `<div class="eye">Time capsule</div><h1>Open It Someday.</h1>${MT()}<p class="mut" style="margin-bottom:14px">Seal notes and predictions together. It stays locked until the date you pick.</p><button class="btn" style="margin-bottom:16px" onclick="newCap()">+ Create a capsule</button>`+(S.caps.map((c,i)=>{const L=left(c),a=new Date(c.created_at),b=new Date(c.unlock_at),pct=Math.min(95,Math.max(6,(Date.now()-a)/(b-a)*100));return L>0?`<div class="card" style="margin-bottom:12px;cursor:pointer" onclick="capNote(${i})"><div class="row"><div class="img" style="width:56px;height:56px;flex:none;font-size:26px;background:var(--t)">🔒</div><div style="flex:1"><b>${esc(c.title)}</b><div class="mut">Opens ${fd(b)}</div></div></div><div class="bar" style="margin:12px 0 6px"><i style="width:${pct}%"></i></div><div class="row sp mut"><span>${L} day${L==1?"":"s"} to go</span><span>Tap to add a note or photo</span></div></div>`:`<div class="card" style="margin-bottom:12px;background:var(--yel);border:0"><div class="row"><div class="img" style="width:56px;height:56px;flex:none;font-size:26px;background:var(--card)">💌</div><div><b>${esc(c.title)}</b><div class="mut">Unlocked ${fd(b)}</div></div></div><button class="btn" style="margin-top:12px" onclick="openCap(${i})">Open together</button></div>`}).join("")||'<div class="empty">No capsules yet. Seal your first one 💌</div>')}
function sheet(h){const s=document.createElement("div");s.className="sheet";s.onclick=e=>{if(e.target==s)s.remove()};s.innerHTML=`<div>${h}</div>`;$("#app").append(s);return s}
function newCap(){if(!S.couple)return toast("Pair with your partner first");sheet(`<div class="eye">New capsule</div><h1 style="font-size:22px;margin-bottom:14px">Seal something for later</h1><input id="ct" placeholder="Title (e.g. Our first year)" maxlength="80" style="${FS}"><textarea id="cn" placeholder="Write a note to future you two…" style="${TA}"></textarea>${PH("cf")}<select id="cd" style="width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;font-size:14px;margin-bottom:14px"><option value="3">Opens in 3 months</option><option value="6" selected>Opens in 6 months</option><option value="12">Opens in 1 year</option><option value="24">Opens in 2 years</option></select><button class="btn" id="sb" onclick="seal()">Seal capsule 🔒</button>`)}
async function seal(){const t=$("#ct").value.trim()||"Untitled capsule",n=$("#cn").value.trim(),f=$("#cf").files[0],b=$("#sb"),d=new Date();d.setMonth(d.getMonth()+ +$("#cd").value);if(big(f))return;busy(b,"Sealing…");try{await api.createCapsule(S.couple.coupleId,S.user.id,t,d.toISOString(),n,f);document.querySelector(".sheet").remove();toast("Sealed 🔒 Opens "+fd(d)+(S.mate?". "+S.mate.name+" can add to it.":""));await loadCoupleData();render()}catch(e){toast(e.message);busy(b)}}
// Notes are hidden by the database until unlock_at, so a sealed capsule only offers "add a note".
function capNote(i){const c=S.caps[i];sheet(`<div class="eye">Sealed 🔒 ${left(c)} days to go</div><h1 style="font-size:22px;margin-bottom:6px">${esc(c.title)}</h1><p class="mut" style="margin-bottom:14px">Opens ${fd(new Date(c.unlock_at))}. Notes stay hidden from both of you until then.</p><textarea id="cn" placeholder="Add a note to the capsule…" style="${TA}"></textarea>${PH("cf")}<button class="btn" id="nb" onclick="addNote(${i})">Add to capsule</button>`)}
async function addNote(i){const n=$("#cn").value.trim(),f=$("#cf").files[0],b=$("#nb");if(!n&&!f)return toast("Write a note or pick a photo");if(big(f))return;busy(b,"Adding…");try{await api.addCapsuleNote(S.couple.coupleId,S.caps[i].id,S.user.id,n,f);document.querySelector(".sheet").remove();toast("Added to the capsule 💌")}catch(e){toast(e.message);busy(b)}}
async function openCap(i){const c=S.caps[i];try{const items=await api.openCapsule(c.id);sheet(`<div class="eye">Opened 💌</div><h1 style="font-size:22px;margin-bottom:14px">${esc(c.title)}</h1>${items.map(m=>`<div class="card" style="margin-bottom:10px"><div class="mut" style="margin-bottom:4px">From ${who(m.author_id)}</div>${m.photo_url?`<img src="${esc(m.photo_url)}" alt="" style="width:100%;border-radius:14px;margin:4px 0 ${m.body?8:0}px">`:""}${esc(m.body||"")}</div>`).join("")||'<div class="empty">No notes were added to this one.</div>'}<button class="btn" onclick="this.closest('.sheet').remove()">Close</button>`)}catch(e){toast(e.message)}}
// ---------- Memories ----------
const GR=["#f9d5e5","#fbe9a6","#fde0c8","#eee8f6","#d8f0dc"],HT=[140,190,110,170,120];
function newMem(){if(!S.couple)return toast("Pair with your partner first");const t=iso(new Date());sheet(`<div class="eye">New memory</div><h1 style="font-size:22px;margin-bottom:14px">Save a moment</h1><input id="mt" placeholder="What happened? (e.g. Pottery night)" maxlength="80" style="${FS}"><input id="md" type="date" aria-label="When" value="${t}" max="${t}" style="${FS}">${PH("mp")}<button class="btn" id="ms" onclick="saveMem()">Save memory</button>`)}
async function saveMem(){const t=$("#mt").value.trim(),f=$("#mp").files[0],b=$("#ms");if(!t)return toast("Give it a title");if(big(f))return;busy(b,"Saving…");try{await api.addMemory(S.couple.coupleId,S.user.id,t,$("#md").value||iso(new Date()),f);document.querySelector(".sheet").remove();toast("Memory saved 📸");await loadCoupleData();render()}catch(e){toast(e.message);busy(b)}}
function viewMem(i){const m=S.mems[i],mine=m.author_id==S.user.id;sheet(`${m.photo_url?`<img src="${esc(m.photo_url)}" alt="" style="width:100%;max-height:50vh;object-fit:cover;border-radius:18px;margin-bottom:14px">`:""}<h1 style="font-size:22px">${esc(m.title)}</h1><p class="mut" style="margin:6px 0 16px">${fd(day(m.occurred_on))} · added by ${who(m.author_id)}</p>${mine?`<button class="btn sec" style="margin-bottom:10px" onclick="delMem(${i})">Delete memory</button>`:""}<button class="btn" onclick="this.closest('.sheet').remove()">Close</button>`)}
async function delMem(i){if(!confirm("Delete this memory? This can't be undone."))return;try{await api.deleteMemory(S.mems[i]);document.querySelector(".sheet").remove();toast("Memory deleted");await loadCoupleData();render()}catch(e){toast(e.message)}}
// Shrinking filters what we already have instantly; the server query follows once the slider stops moving.
function rad(v){S.r=+v;$("#rl").textContent=v+" km";$("#lst").innerHTML=LST();clearTimeout(rad.t);rad.t=setTimeout(loadPlaces,250)}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2200)}
async function save(n){if(!S.couple)return toast("Pair with your partner to share a wishlist");const name=D.find(x=>x.pid==n)?.n;try{if(S.saved.has(n)){await api.removeFromWishlist(n,S.user.id);S.saved.delete(n);toast("Removed from wishlist")}else{await api.saveToWishlist(S.couple.coupleId,n,S.user.id);S.saved.add(n);S.partner.has(n)?toast("❤️ It's a Match! You both want to try "+name+"."):toast("Saved to your shared wishlist")}}catch(e){toast(e.message)}render()}
function card(d,w){return `<div class="card" style="padding:10px;${w?'':'flex:0 0 190px'}"><div class="img" role="img" aria-label="${esc(what(d))}" style="cursor:pointer;background:${pbg(d)}" onclick="detail('${d.id}')">${d.ph?"":d.e}</div><div style="font-weight:600;margin:10px 4px 0;cursor:pointer" onclick="detail('${d.id}')">${esc(d.t)}</div><div style="margin:0 4px 2px;font-size:13px;color:var(--p)">at ${esc(d.n)}</div><div class="mut" style="margin:0 4px 8px">${esc(d.p)} · ${d.d} · ${d.k.toFixed(1)} km</div><div class="row sp" style="margin:0 4px"><button class="save ${S.saved.has(d.pid)?'on':''}" onclick="save('${d.pid}')">${S.saved.has(d.pid)?'♥ Saved':'♡ Save'}</button>${w?`<a class="save" style="text-decoration:none" target="_blank" rel="noopener" href="${esc(cal(d))}">📅 Add</a>`:''}</div></div>`}
function detail(n){const d=D.find(x=>x.id==n);const s=document.createElement("div");s.className="sheet";s.onclick=e=>{if(e.target==s)s.remove()};s.innerHTML=`<div><div class="img" role="img" aria-label="${esc(d.n)}" style="height:${d.ph?200:140}px;font-size:60px;background:${pbg(d)}">${d.ph?"":d.e}</div>${d.cr?`<p class="mut" style="font-size:10px;margin-top:4px">Photo: ${esc(d.cr)}</p>`:""}<h1 style="font-size:24px;margin-top:12px">${esc(d.t)}</h1><div style="font-size:16px;font-weight:600;color:var(--p);margin-top:2px">at ${esc(d.n)}</div><p class="mut" style="margin:6px 0 12px">${d.b?esc(d.p)+" each, est.":"Free"} · ${d.d} · ${d.k.toFixed(1)} km away · ${season(d.mo)}<br>📍 ${esc(d.a)}</p>${d.tip?`<p style="font-size:14px;line-height:1.5;margin-bottom:8px">💡 ${esc(d.tip)}</p>`:""}<p class="mut" style="font-size:13px;line-height:1.5;margin-bottom:16px">${esc(d.w)}</p><div class="row"><a class="btn sec" style="display:grid;place-items:center;text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}">Directions</a><a class="btn" style="display:grid;place-items:center;text-decoration:none" target="_blank" rel="noopener" href="${esc(cal(d))}">Add to Calendar</a></div></div>`;$("#app").append(s)}
const V={
home:()=>`<p class="mut">Good ${["Morning","Afternoon","Evening"][new Date().getHours()<12?0:new Date().getHours()<18?1:2]}</p><div class="row" style="gap:12px;margin-top:6px"><div class="row" style="gap:0;cursor:pointer" title="Change your photo in Settings" onclick="S.sub='settings';go('profile')">${av(S.me)}${S.mate?`<span style="margin-left:-12px;display:flex">${av(S.mate)}</span>`:""}</div><h1>${S.mate?esc(S.me?.name)+" & "+esc(S.mate.name):"Hi, "+esc(S.me?.name)} ❤️</h1></div><div class="stats" style="grid-template-columns:repeat(3,1fr)"><div><b>${days()??"–"}</b><span>Days together</span></div><div><b>${S.mems.length}</b><span>Memories</span></div><div style="background:var(--yel)"><b>${S.caps.length}</b><span>Capsules</span></div></div>${S.couple&&!S.couple.startedOn?`<div class="card" style="margin-top:12px"><b>When did you two get together?</b><p class="mut" style="margin:4px 0 12px">We'll count your days together. You can change it later in Settings.</p><input id="sd" type="date" max="${iso(new Date())}" style="${FS}"><button class="btn" onclick="saveStart()">Save date</button></div>`:''}
<div class="card" style="margin-top:16px;background:linear-gradient(135deg,var(--t),var(--pink));border:0"><div class="eye">Tonight</div><h1 style="font-size:22px">Plan Your Next Date</h1><p class="mut" style="margin:6px 0 14px">Fresh ideas near ${CITIES.some(c=>c[0]==S.here.label)?esc(S.here.label):"you"}</p><button class="btn" onclick="go('explore')">Explore Date Ideas</button></div>${S.mate?'':`<div class="card" style="margin-top:12px"><b>Invite your partner</b><p class="mut" style="margin:4px 0 12px">Pair up to share a wishlist and see your matches.</p><button class="btn sec" onclick="pairing()">Pair with your partner</button></div>`}
<h2>Recommended for ${S.mate?"You Two":"You"}</h2><div class="scroll">${perPlace(D).slice(0,6).map(d=>card(d)).join("")}</div>
${qdNudge()}<h2>Today's Couple Challenge</h2>${CHC()}`,
explore:()=>{const cats=["All","Romantic","Creative","Outdoors","Classes","Food & Drinks","Adventurous","Relaxing"],buds=["Any","Free","Under $25","$25–$50","$50+"];const bm={Free:0,"Under $25":1,"$25–$50":2,"$50+":3};window.BM=bm;
return `<div class="eye">Date discovery</div><h1>Find Your Perfect Date.</h1><div class="card" style="margin:16px 0 4px"><div class="row sp"><b>Distance</b><span id="rl" style="color:var(--p);font-weight:600">${S.r} km</span></div><input type="range" min="1" max="50" value="${S.r}" style="width:100%;accent-color:var(--p);margin:10px 0 4px" oninput="rad(this.value)"><div class="row sp mut"><select aria-label="Search from" onchange="pickCity(this.value)" style="border:0;background:none;color:var(--mut);font-size:13px;padding:0;cursor:pointer">${CITIES.some(c=>c[0]==S.here.label)?'':`<option selected disabled>📍 ${esc(S.here.label)}</option>`}${CITIES.map((c,i)=>`<option value="${i}" ${S.here.label==c[0]?'selected':''}>📍 ${c[0]}</option>`).join("")}</select><span style="cursor:pointer;color:var(--p)" onclick="useLoc()">Use my location</span></div></div><div style="margin:16px 0 4px">${buds.map(b=>`<span class="chip ${S.bud==b?'on':''}" onclick="S.bud='${b}';render()">${b}</span>`).join("")}</div><div>${cats.map(b=>`<span class="chip ${S.cat==b?'on':''}" onclick="S.cat='${b}';render()">${b}</span>`).join("")}</div><div id="lst" style="margin-top:8px;display:grid;gap:12px">${LST()}</div>`},
games:()=>{const G=[["💞","How Well Do You Know Me?","5 min"],["🤔","Would You Rather?","10 min"],["🔤","Heads Up!","8 min"],["🧩","Make a Word","6 min"],["💧","Fill the Water Cup","3 min"],["🏆","Couple Trivia","10 min"]];
return `<div class="eye">Games</div><h1>Play Together.</h1>${QDC()}<h2>Coming soon</h2><div style="display:grid;gap:12px">${G.map(g=>`<div class="card row" style="opacity:.75"><div class="img" style="width:60px;height:60px;flex:none;font-size:28px;background:var(--t)">${g[0]}</div><div style="flex:1"><b style="font-size:15px">${g[1]}</b><div class="mut">${g[2]}</div></div><button class="save" onclick="toast('${g[1]} is coming soon')">Soon</button></div>`).join("")}</div>`},
memories:()=>S.mem=="capsule"?CAP():`<div class="eye">Memories</div><h1>Our Story.</h1>${MT()}<div class="card" style="margin:16px 0;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;border:0"><b>Our Story So Far</b><div class="row" style="margin:12px 0 4px;flex-wrap:wrap">${[[days()??"–","days together"],[S.mems.length,"memories"],[S.caps.length,"capsules"]].map(a=>`<div style="flex:1;min-width:60px"><b style="font-size:24px">${a[0]}</b><div style="font-size:11px;opacity:.8">${a[1]}</div></div>`).join("")}</div></div>
${S.mems.length?`<div class="grid">${S.mems.map((m,i)=>`<div style="height:${HT[i%5]}px;cursor:pointer;background:${m.photo_url?`url('${esc(m.photo_url)}') center/cover`:GR[i%5]}" onclick="viewMem(${i})">${m.photo_url?"":"📸"}<small style="background:rgba(255,255,255,.85);padding:2px 6px;border-radius:8px">${esc(m.title)} · ${fd(day(m.occurred_on))}</small></div>`).join("")}</div>`:`<div class="empty">No memories yet. Add your first one 📸</div>`}<button class="btn sec" onclick="newMem()">+ Add memory</button>`,
profile:()=>{const sub=S.sub||"checkin";return `<div class="eye">Us</div><h1>${sub=="pet"?"Our Pet":sub=="settings"?"Settings":"How Are We Doing Today?"}</h1><div style="margin:14px 0">${[["checkin","Check-in"],["pet","Pet"],["settings","Settings"]].map(a=>`<span class="chip ${sub==a[0]?'on':''}" onclick="S.sub='${a[0]}';render()">${a[1]}</span>`).join("")}</div>`+(sub=="settings"?SET():sub=="pet"?PET():CHK())}};
function CHK(){if(!S.couple)return '<div class="empty">Pair with your partner to start checking in together.</div>';return `<div class="row">${MOODS.map(m=>`<button class="mood ${S.mood==m[0]?'on':''}" aria-label="${m[0]}" onclick="pickOne(this,'mood','${m[0]}')">${m[1]}</button>`).join("")}</div><p class="mut" style="margin:14px 0 6px">What's one thing that made you smile today?</p><textarea id="msg" maxlength="500" style="width:100%;height:70px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px;font-size:14px"></textarea><label class="row mut" style="margin:10px 0"><input type="checkbox" ${S.share?'checked':''} onchange="S.share=this.checked"> Share with ${S.mate?esc(S.mate.name):"your partner"}</label><button class="btn" id="cb" onclick="ci()">Save check-in</button><h2>Recent</h2>${S.checks.map(c=>`<div class="card row" style="margin-bottom:8px"><span style="font-size:24px">${MOOD[c.mood]||"🙂"}</span><div><b>${c.user_id==S.user.id?"You":esc(S.mate?.name||"Your partner")}</b> <span class="mut">· ${fd(new Date(c.created_at))}${c.shared?"":" · 🔒 Private"}</span><div class="mut">${esc(c.note||"No note")}</div></div></div>`).join("")||'<div class="empty">No check-ins yet. How are you feeling today?</div>'}`}
function PET(){const p=S.pet;if(!S.couple||!p)return '<div class="empty">Pair with your partner to adopt a pet together.</div>';
  if(!p.name||S.petEdit){S.pk=S.pk||p.kind||"bunny";return `<div class="card"><b>${p.name?"Change your pet":"Adopt a pet together"}</b><p class="mut" style="margin:4px 0 12px">Pick an animal and give it a name.${S.mate?" "+esc(S.mate.name)+" will see it too.":""}</p><div class="row" style="margin-bottom:12px">${KINDS.map(k=>`<button class="mood ${S.pk==k[0]?'on':''}" aria-label="${k[0]}" onclick="pickOne(this,'pk','${k[0]}')">${k[1]}</button>`).join("")}</div><input id="pn" maxlength="20" placeholder="Name (e.g. Biscuit)" value="${esc(p.name||"")}" style="${FS}"><button class="btn" onclick="adopt()">${p.name?"Save":"Adopt"}</button>${p.name?`<button class="btn sec" style="margin-top:10px" onclick="S.petEdit=false;render()">Cancel</button>`:""}</div>`}
  const lv=Math.floor(p.xp/100)+1;return `<div class="card"><div class="pet">${PE(p.kind)}</div><div class="row sp"><b>${esc(p.name)} · Level ${lv}</b><span class="mut">Happiness ${p.happiness}%</span></div><div class="bar" style="margin:10px 0"><i style="width:${p.xp%100}%"></i></div><p class="mut">${p.xp%100}/100 XP to level ${lv+1}</p><div class="row" style="margin-top:14px"><button class="btn" onclick="feed()">Feed 🍓</button><button class="btn sec" onclick="S.petEdit=true;S.pk=null;render()">Change pet</button></div></div>`}
async function adopt(){const n=$("#pn").value.trim();if(!n)return toast("Give your pet a name");try{S.pet=await api.setPet(S.couple.coupleId,{name:n,kind:S.pk});S.petEdit=false;toast("Say hi to "+n+" "+PE(S.pet.kind));render()}catch(e){toast(e.message)}}
async function feed(){try{S.pet=await api.feedPet(S.couple.coupleId,S.pet);toast("Yum! +10 XP");render()}catch(e){toast(e.message)}}
function setTheme(t,q){S.theme=t;const r=document.documentElement;t=="auto"?r.removeAttribute("data-theme"):r.dataset.theme=t;if(!q){toast((t=="auto"?"Matching your phone":t=="dark"?"Dark theme on":"Light theme on"));render()}}
function SET(){const o=[["light","Light","Our signature look","#faf9f6","#7560aa"],["dark","Dark","Easy on the eyes at night","#1d1a24","#9b87d1"],["auto","Auto","Follow your phone","linear-gradient(90deg,#faf9f6 50%,#1d1a24 50%)","#7560aa"]];return `<h2 style="margin-top:0">Your photo</h2><div class="card row">${av(S.me,56)}<div style="flex:1"><b>${esc(S.me?.name)}</b><div class="mut">Seen by you${S.mate?" and "+esc(S.mate.name):" and your partner"}</div></div><label class="save on" style="cursor:pointer">${S.me?.avatar_src?"Change":"Add photo"}<input type="file" accept="image/*" hidden onchange="setAv(this)"></label></div><h2>Appearance</h2>${o.map(a=>`<div class="card row" style="margin-bottom:10px;${S.theme==a[0]?'border:2px solid var(--p)':''}" onclick="setTheme('${a[0]}')"><div style="width:52px;height:52px;border-radius:14px;background:${a[3]};border:1px solid var(--line);display:grid;place-items:end start;padding:8px"><i style="width:16px;height:16px;border-radius:50%;background:${a[4]}"></i></div><div style="flex:1"><b>${a[1]}</b><div class="mut">${a[2]}</div></div><span style="color:var(--p);font-size:18px">${S.theme==a[0]?'✓':''}</span></div>`).join("")}<h2>Partner</h2><div class="card row sp"><span>${S.mate?"Paired with "+esc(S.mate.name)+" ❤️":"Not paired yet"}</span>${S.mate?"":`<button class="save on" onclick="pairing()">Pair</button>`}</div>${S.couple?`<h2>Together since</h2><div class="card row sp"><input id="sd" type="date" aria-label="Together since" value="${S.couple.startedOn||""}" max="${iso(new Date())}" style="border:0;background:none;color:var(--ink);font-size:15px"><button class="save on" onclick="saveStart()">Save</button></div>`:""}<h2>Your interests</h2><div class="card"><div class="mut" style="margin-bottom:12px">${S.me?.activity_prefs?.length?esc(S.me.activity_prefs.join(", "))+" · "+BUDS[S.me.budget_pref??3]+" · within "+(S.me.travel_km||15)+" km of "+esc(S.me.home_label||"you"):"You haven't taken the quiz yet."}</div><button class="btn sec" onclick="quiz()">${S.me?.activity_prefs?.length?"Retake quiz":"Take the quiz"}</button></div><h2>Account</h2><div class="card row sp"><span class="mut">${esc(S.user?.email)}</span><button class="save" onclick="logout()">Sign out</button></div>`}
async function ci(){if(!S.mood)return toast("Pick a mood first");const b=$("#cb");b.disabled=true;try{await api.addCheckIn(S.couple.coupleId,S.user.id,S.mood,$("#msg").value.trim()||null,S.share);S.mood=null;toast(S.share?"Shared with "+(S.mate?.name||"your partner")+" ❤️":"Saved privately");S.checks=await api.listCheckIns();render()}catch(e){toast(e.message);b.disabled=false}}

  // Nothing within their distance? Look further out rather than show nothing.

  let rows=await api.activitiesNearby({lat,lng,radiusKm:q.km,month});if(!rows.length)rows=await api.activitiesNearby({lat,lng,radiusKm:50,month});
  S.picks=perPlace(rows.map(act));S.pi=0;match()}catch(e){toast(e.message);quiz(3)}}
function match(){$("#nav").style.display="none";const d=S.picks[S.pi%S.picks.length];
  if(!d){$("#v").innerHTML=`<div class="eye">Your date match</div><h1>Nothing nearby yet.</h1><p class="mut" style="margin:10px 0 20px">We don't have places within 50 km of ${esc(S.here.label)} yet. More areas are coming.</p><button class="btn" onclick="afterQuiz()">Continue</button>`;return}
  const why=[S.me.activity_prefs?.includes(d.c)?"You love "+d.c:d.c,d.b<=(S.me.budget_pref??3)?"Fits your budget":"A bit over budget",d.k.toFixed(1)+" km away",...(d.mo?["In season now"]:[])];
  $("#v").innerHTML=`<div class="eye">Your date match ✨</div><h1>${esc(d.t)}</h1><div style="font-size:18px;font-weight:600;color:var(--p);margin:2px 0 14px">at ${esc(d.n)}</div><div class="img" role="img" aria-label="${esc(d.n)}" style="height:190px;font-size:64px;background:${pbg(d)}">${d.ph?"":d.e}</div>${d.cr?`<p class="mut" style="font-size:10px;margin-top:4px">Photo: ${esc(d.cr)}</p>`:""}<div style="margin:12px 0 4px">${why.map(w=>`<span class="chip" style="cursor:default">${esc(w)}</span>`).join("")}</div><div class="card" style="margin-bottom:12px"><b>The plan</b><p style="font-size:14px;line-height:1.5;margin-top:6px">${esc(d.tip||PLAN[d.c]||"")}</p><p class="mut" style="font-size:13px;line-height:1.5;margin-top:6px">${esc(d.w)}</p><p class="mut" style="margin-top:10px">⏱ ${d.d||"A few hours"} · 💸 ${cost(d)} (estimate)</p><p class="mut" style="margin-top:4px">📍 ${esc(d.a)}</p></div><div class="row" style="margin-bottom:10px"><a class="btn sec" style="display:grid;place-items:center;text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}">Directions</a><a class="btn sec" style="display:grid;place-items:center;text-decoration:none" target="_blank" rel="noopener" href="${esc(cal(d))}">Add to Calendar</a></div>${S.picks.length>1?`<button class="btn sec" style="margin-bottom:10px" onclick="S.pi++;match()">Show me another</button>`:""}<button class="btn" onclick="afterQuiz()">Looks good →</button>`}
function afterQuiz(){S.couple?enterApp(true):pairing()}
// ---------- Pairing (invite codes) ----------
function pairing(){$("#nav").style.display="none";$("#v").innerHTML=`<div class="eye">Pair up</div><h1>Connect With Your Partner.</h1><p class="mut" style="margin:10px 0 20px">One of you creates a code, the other types it in. Codes last 48 hours.</p><div class="card" style="margin-bottom:12px"><b>Invite your partner</b><p class="mut" style="margin:4px 0 12px">Make a code and send it to them.</p><div id="code" style="display:none;font-size:34px;font-weight:700;letter-spacing:6px;text-align:center;color:var(--p);margin-bottom:12px"></div><button class="btn" id="mk" onclick="makeCode()">Create invite code</button></div><div class="card" style="margin-bottom:16px"><b>Got a code from your partner?</b><p class="mut" style="margin:4px 0 12px">Type it here to join them.</p><input id="jc" maxlength="6" placeholder="e.g. 3FA9C1" autocomplete="off" style="${FS};text-transform:uppercase;letter-spacing:3px"><button class="btn" onclick="joinCode()">Join</button></div><button class="btn sec" onclick="enterApp(true)">Continue to the app</button>`}
async function makeCode(){const b=$("#mk");b.disabled=true;try{const c=await api.createInvite(),el=$("#code");el.textContent=c;el.style.display="";b.textContent="Make a new code";try{await navigator.clipboard.writeText(c);toast("Code copied. Send it to your partner")}catch{toast("Send this code to your partner")}}catch(e){toast(e.message)}b.disabled=false}
async function joinCode(){const v=$("#jc").value.trim();if(v.length!=6)return toast("Codes are 6 characters");try{await api.joinCouple(v);await enterApp(true);toast(S.mate?"Paired with "+S.mate.name+" ❤️":"Paired ❤️")}catch(e){toast(e.message)}}
setTheme(S.theme,1);$("#nav").style.display="none";$("#v").innerHTML='<div class="empty">Loading…<br><br>Stuck here? Open the app through the local server (http://localhost:3000), not by double-clicking the file.</div>';
</script>
